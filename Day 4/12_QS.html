<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        Name:
        <input type="text" placeholder="Write your name">
    </form>
    <form>
        Email:
        <input type="email" placeholder="Write your email" >
    </form>
    <form>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea>
    </form>
    <form>
        Rate us out of 5:
        <br>
        <label for="1" >1</label>
        <input type="checkbox" id="1" name="rating" value="1">
        <br>
        <label for="2" >2</label>
        <input type="checkbox" id="2" name="rating" value="2">
        <br>
        <label for="3" >3</label>
        <input type="checkbox" id="3" name="rating" value="3">
        <br>
        <label for="4" >4</label>
        <input type="checkbox" id="4" name="rating" value="4">
        <br>
        <label for="5" >5</label>
        <input type="checkbox" id="5" name="rating" value="5">
    </form>
    <button>send your message!</button>
</body>
</html>
