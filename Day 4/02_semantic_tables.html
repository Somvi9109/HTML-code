<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tables</title>
</head>
<body>
    <table>
        <caption>student attendance</caption>
        <thead>
            <tr>
                <th>Name</th>
                <th>attendance</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
                <td>Somvi</td>
                <td>90%</td>
            </tr>
            <tr>
                <td>Rishab</td>
                <td>92%</td>
            </tr>
            <tr>
                <td>Harshit</td>
                <td>89%</td>
            </tr>
            <tr>
                <td>chirag</td>
                <td>95%</td>
            </tr>
        </tbody>
        
    </table>
</body>
</html>
