<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Element</title>
</head>
<body>
    <form action="/action">
        <div>
            <label for="username">Username :</label>
            <input type="text" placeholder="Enter Name" id="username">
        </div> 

        <div>
            <label for="password">Password</label>
            <input type="password" placeholder="Enter password" id="password">
        </div>

        <div>
            <label for="age"> Age</label>
            <input type="number" placeholder=" Enter Age" id="age">
        </div>
        
        <div>
            <label for="time">Time</label>
            <input type="time" placeholder="Enter Time" id="time">
        </div>
        
        <div>
            <label for="color">Color</label>
            <input type="color" placeholder="Enter Color" id="color">
        </div>
        <button> sign in </button>
        <button type="button"> log in</button>
        <button type="reset"> Resent</button>
        <button type="submit"> Submit</button>
        <br>
        <input type="button" value="click me">
        <input type="submit" value="click me 1">
    </form>
</body>
</html>
