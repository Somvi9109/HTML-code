<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Attribute</title>
</head>
<body>
    <form action="/query">
        <div>
            <label for="username">Username :</label>
            <input type="text" placeholder="Enter Name" id="username" name="user">
        </div> 

        <div>
            <label for="password">Password</label>
            <input type="password" placeholder="Enter password" id="password" name="pass">
        </div>
        <button>save</button>
    </form>
    <hr>
    <form action="https://www.youtube.com/results">
    <input type="text" placeholder="Search in youtube" name="search_query">
    <button>Search</button>
    </form>
    <hr>
    <form>
        <input type="checkbox" name="Age" id="age">
        <label for="age"> your age is 18+</label>
        <br>
        <button>submit</button>
    </form>
    <form>
        <input type="checkbox" name="Age" id="age" checked>
        <label for="age"> age is 18+</label>
    </form>
    <form>
        <input type="checkbox" name="Sub" id="math" value="math">
        <label for="math">math</label>
        <input type="checkbox" name="Sub" id="eng" value="eng">
        <label for="eng"> eng</label>
        <input type="checkbox" name="Sub" id="sci" value="sci">
        <label for="sci"> sci</label>
        <button>submit</button>
    </form>
</body>
</html>
